
<div
    data-dashboard
    class="w-full h-full overflow-y-auto px-4 py-2 mt-10 text-[#99512F]"
>
    <!-- สรุปข้อมูลล่าสุด -->
    <section
        class="w-full rounded-2xl border border-[#F5D77A] bg-[#FFFDF3] p-3"
    >
        <h2 class="mb-3 text-xs text-[#C88A58]">
            สรุปข้อมูลล่าสุด
        </h2>

        <div class="grid grid-cols-3 gap-2">

            <!-- อัตราสิ้นเปลืองเฉลี่ย -->
            <div
                class="flex min-w-0 flex-col items-center justify-center rounded-2xl border border-[#F5D77A] bg-[#FFF8C9] px-1 py-3 text-center"
            >
                <p
                    id="average-efficiency"
                    class="text-base font-bold leading-5"
                >
                    -
                </p>

                <p class="mt-1 text-[11px]">
                    กม./ลิตร
                </p>

                <p class="text-[11px] text-[#C88A58]">
                    อัตราสิ้นเปลืองเฉลี่ย
                </p>
            </div>

            <!-- ค่าใช้จ่ายทั้งหมดของเดือนนี้ -->
            <div
                class="flex min-w-0 flex-col items-center justify-center rounded-2xl border border-[#F5D77A] bg-[#FFF8C9] px-1 py-3 text-center"
            >
                <p
                    id="monthly-expense"
                    class="text-base font-bold leading-5"
                >
                    -
                </p>

                <p class="mt-1 text-[11px]">
                    เดือนนี้
                </p>

                <p class="text-[11px] text-[#C88A58]">
                    ค่าใช้จ่ายทั้งหมด
                </p>
            </div>

            <!-- จำนวนครั้งที่เติมน้ำมัน -->
            <div
                class="flex min-w-0 flex-col items-center justify-center rounded-2xl border border-[#F5D77A] bg-[#FFF8C9] px-1 py-3 text-center"
            >
                <p
                    id="record-count"
                    class="text-base font-bold leading-5"
                >
                    -
                </p>

                <p class="mt-1 text-[11px]">
                    ครั้ง
                </p>

                <p class="text-[11px] text-[#C88A58]">
                    จำนวนรายการ
                </p>
            </div>

        </div>
    </section>

    <!-- ปุ่มเพิ่มรายการเติมน้ำมัน -->
    <button
        type="button"
        class="mt-3 flex w-full items-center justify-center gap-2 rounded-full border border-[#F5D77A] bg-[#FFF8C9] px-4 py-3 text-sm text-[#99512F] transition hover:bg-[#FFF1A8] active:scale-[0.98] cursor-pointer "
        data-page="addrecord"
    >
        <span class="text-base">+</span>
        <span>เพิ่มรายการเติมน้ำมัน</span>
    </button>

    <!-- รายการเติมน้ำมันล่าสุด -->
    <section class="mt-3 w-full">

        <h2 class="mb-2 text-xs text-[#C88A58]">
            รายการเติมน้ำมันล่าสุด
        </h2>

        <!-- dashboard.js จะสร้างรายการจาก API ภายในส่วนนี้ -->
        <div
            id="recent-fuel-records"
            class="flex flex-col gap-2"
        >
            <p class="text-xs text-[#C88A58]">
                กำลังโหลดข้อมูล...
            </p>
        </div>

    </section>

    <!-- ดูประวัติทั้งหมด -->
    <button
        type="button"
        class="mt-4 mb-4 w-full py-1 text-center text-xs text-[#C88A58] transition hover:text-[#99512F]"
        data-page="history"
    >
        ดูประวัติทั้งหมด →
    </button>

</div>
